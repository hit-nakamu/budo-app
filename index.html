<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>武道稽古記録 & AIアドバイザー</title>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary-color: #1a252f;
      --accent-color: #2980b9;
      --ai-color: #8e44ad;
      --gorin-color: #d35400;
      --bg-color: #f4f6f7;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-color: #2c3e50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding-bottom: 40px;
    }

    /* ヘッダー */
    header {
      background: var(--primary-color);
      color: white;
      text-align: center;
      padding: 16px 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: bold;
    }

    /* ナビゲーションタブ */
    .nav-tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 4px;
      background: none;
      border: none;
      font-size: 0.85rem;
      font-weight: bold;
      color: #7f8c8d;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      text-align: center;
    }

    .tab-btn.active {
      color: var(--accent-color);
      border-bottom-color: var(--accent-color);
    }

    /* メインコンテンツ容器 */
    .container {
      max-width: 600px;
      margin: 16px auto;
      padding: 0 12px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* カード */
    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* フォーム要素 */
    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #34495e;
    }

    input[type="date"],
    input[type="text"],
    input[type="number"],
    textarea,
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      background-color: #fff;
    }

    textarea {
      resize: vertical;
      height: 80px;
    }

    /* ボタン */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: white;
    }

    .btn-ai {
      background-color: var(--ai-color);
      color: white;
      margin-top: 10px;
    }

    /* AIアドバイスボックス */
    .ai-box {
      background: #f4ecf7;
      border: 1px solid #d2b4de;
      border-left: 4px solid var(--ai-color);
      border-radius: 6px;
      padding: 14px;
      margin-top: 14px;
      display: none;
    }

    .ai-title {
      font-weight: bold;
      color: var(--ai-color);
      font-size: 0.95rem;
      margin-bottom: 6px;
    }

    .ai-text {
      font-size: 0.9rem;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    /* 履歴リスト */
    .log-item {
      background: white;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-color);
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .log-date {
      font-size: 0.85rem;
      color: #7f8c8d;
      font-weight: bold;
    }

    .log-menu {
      font-weight: bold;
      color: var(--primary-color);
    }

    .log-count {
      font-size: 0.85rem;
      background: #eef2f7;
      padding: 2px 8px;
      border-radius: 12px;
      color: var(--accent-color);
    }

    .log-memo {
      font-size: 0.9rem;
      color: #475569;
      white-space: pre-wrap;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #e2e8f0;
    }

    /* 五輪書ビューア */
    .gorin-box {
      background: #fffdfa;
      border: 1px solid #f3e5f5;
      border-left: 4px solid var(--gorin-color);
      border-radius: 6px;
      padding: 14px;
      margin-top: 10px;
      max-height: 450px;
      overflow-y: auto;
    }

    .gorin-chapter-title {
      font-weight: bold;
      color: var(--gorin-color);
      font-size: 1rem;
      margin-bottom: 10px;
      border-bottom: 1px solid #f0e2d0;
      padding-bottom: 4px;
    }

    .gorin-body {
      font-size: 0.9rem;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .empty-state {
      text-align: center;
      color: #94a3b8;
      padding: 30px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>🥋 武道稽古記録 & AIアドバイザー</h1>
  </header>

  <!-- タブ切り替えメニュー -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('recordTab')">📝 記録する</button>
    <button class="tab-btn" onclick="switchTab('historyTab')">📋 稽古履歴</button>
    <button class="tab-btn" onclick="switchTab('analysisTab')">📊 過去分析</button>
    <button class="tab-btn" onclick="switchTab('gorinTab')">📖 五輪書</button>
  </div>

  <div class="container">

    <!-- 【1. 記録タブ】 -->
    <div id="recordTab" class="tab-content active">
      <div class="card">
        <div class="card-title">本日の稽古を記録</div>
        <form id="keikoForm">
          <div class="form-group">
            <label for="date">稽古日</label>
            <input type="date" id="date" required>
          </div>

          <div class="form-group">
            <label for="menu">種目名</label>
            <input type="text" id="menu" placeholder="例: 形、横一、素振り、禅" required>
          </div>

          <div class="form-group">
            <label for="count">回数・時間</label>
            <input type="number" id="count" placeholder="例: 10 (本/分)" required>
          </div>

          <div class="form-group">
            <label for="memo">メモ・気づき</label>
            <textarea id="memo" placeholder="例: 横一の振りを意識。重心が少しぶれた"></textarea>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary">記録を保存する</button>
          <button type="button" id="aiBtn" class="btn btn-ai">✨ 保存＆AIアドバイスをもらう</button>
        </form>

        <div id="aiAdviceBox" class="ai-box">
          <div class="ai-title">🤖 AI武道師範のアドバイス</div>
          <div id="aiAdviceContent" class="ai-text"></div>
        </div>
      </div>
    </div>

    <!-- 【2. 履歴タブ】 -->
    <div id="historyTab" class="tab-content">
      <div class="card">
        <div class="card-title">稽古の記録一覧</div>
        <div id="logList">
          <div class="empty-state">読み込み中...</div>
        </div>
      </div>
    </div>

    <!-- 【3. 過去分析タブ】（復活） -->
    <div id="analysisTab" class="tab-content">
      <div class="card">
        <div class="card-title">🔍 蓄積データのAI分析</div>
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 14px;">
          これまでの稽古ログ全体をAIが振り返り、全体の傾向や成長の兆し、今後の稽古の指針をアドバイスします。
        </p>
        <button type="button" id="analyzeAllBtn" class="btn btn-ai">全稽古ログをAI分析する</button>

        <div id="analysisResultBox" class="ai-box">
          <div class="ai-title">📊 稽古傾向とアドバイス</div>
          <div id="analysisResultContent" class="ai-text"></div>
        </div>
      </div>
    </div>

    <!-- 【4. 五輪書タブ】（全文） -->
    <div id="gorinTab" class="tab-content">
      <div class="card">
        <div class="card-title">📖 五輪書（宮本武蔵）現代語訳</div>
        <div class="form-group">
          <label for="gorinSelect">読む章を選択</label>
          <select id="gorinSelect" onchange="loadGorinChapter()">
            <option value="chi">地の巻（兵法の土台・基本思想）</option>
            <option value="mizu">水の巻（心構え・構え・身体運用）</option>
            <option value="hi">火の巻（実戦・勝負・駆け引き）</option>
            <option value="kaze">風の巻（他流派研究・兵法の本質）</option>
            <option value="ku">空の巻（極意・自然の理・あるがまま）</option>
          </select>
        </div>

        <div class="gorin-box">
          <div id="gorinTitle" class="gorin-chapter-title"></div>
          <div id="gorinText" class="gorin-body"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Supabase 設定
    const SUPABASE_URL = 'https://fonbifeltukfxpqzjqoj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_bovqGmr1ilPdHixHOzbGxQ_B_9DmZOD';

    let cachedLogs = [];

        text: `【はじめに】
兵法とは、武士が身につけるべき道の基本である。武士たる者は、勝負の理を究め、勝ちを制することを目指さねばならない。

【兵法の道を建てるということ】
兵法を学ぶ者は、まずその「土台（地）」を固めなければならない。ちょうど大工の棟梁が建物の全体の構造を理解し、材木の特性を見極めて適材適所に配するように、兵法家も道具の特性を知り、己の身体と技を巧みに用いることが求められる。

水は四角い器にも丸い器にも柔軟にその形を変え、一滴の水滴ともなれば、広大な大海ともなる。兵法の心もまた、水のように柔軟で透明であり、何物にもとらわれない平常心を保たねばならない。

心は常に平常を保ち、偏らず、硬くならず、伸び伸びと直くあること。精神を静かに据えつつも、身体の動きは自由自在でなければならない。

      },

        text: `【戦いにおける火の勢い】
火は小さく燃え上がり、瞬時に大きく広がる。状況は一刻一刻変化する。火の巻では、実際の戦いにおける勝負の駆け引き、勢いと拍子の支配について説く。

二つの事柄の間に横たわる、何も無い状態を「空」というのではない。自意識や執着、迷いや偏りがすべて消え去った、澄み渡った境地を指すのである。

【真の道】
「心を空にして、直き（すなおき）心を道とす」
実直に稽古を重ね、自らの心を磨き続けた先に、一切の迷いが消えた「真の空」があらわれる。

あらゆる技、あらゆる構え、あらゆる戦略を超越したあるがままの自然体。これこそが兵法・二天一流の究極の到達点である。`
      }
    };

    // タブ切り替え処理
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');

      if (tabId === 'historyTab') {
        fetchLogs();
      }
    }

    // 今日の日付をセット
    document.getElementById('date').valueAsDate = new Date();

    // ログ取得
    async function fetchLogs() {
      const logList = document.getElementById('logList');
      const { data, error } = await supabaseClient
        .from('keiko_logs')
        .select('*')
        .order('date', { ascending: false })
        .order('id', { ascending: false });

      if (error) {
        logList.innerHTML = '<div class="empty-state">データの取得に失敗しました</div>';
        return;
      }

      cachedLogs = data || [];

      if (cachedLogs.length === 0) {
        logList.innerHTML = '<div class="empty-state">まだ記録がありません</div>';
        return;
      }

      logList.innerHTML = '';
      cachedLogs.forEach(log => {
        const div = document.createElement('div');
        div.className = 'log-item';
        div.innerHTML = `
          <div class="log-header">
            <span class="log-menu">${escapeHtml(log.menu || '稽古')}</span>
            <span class="log-count">${log.count || 0}</span>
          </div>
          <div class="log-date">${log.date || ''}</div>
          ${log.memo ? `<div class="log-memo">${escapeHtml(log.memo)}</div>` : ''}
        `;
        logList.appendChild(div);
      });
    }

    // データ保存
    async function saveLogData() {
      const date = document.getElementById('date').value;
      const menu = document.getElementById('menu').value;
      const count = parseInt(document.getElementById('count').value, 10);
      const memo = document.getElementById('memo').value;

      if (!menu || isNaN(count)) {
        alert('種目名と回数を入力してください。');
        return null;
      }

      const { error } = await supabaseClient
        .from('keiko_logs')
        .insert([{ date, menu, count, memo }]);

      if (error) {
        alert('保存エラー: ' + error.message);
        return null;
      }

      return { date, menu, count, memo };
    }

    // 保存ボタン
    document.getElementById('keikoForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;

      const res = await saveLogData();
      if (res) {
        alert('稽古記録を保存しました！');
        document.getElementById('menu').value = '';
        document.getElementById('count').value = '';
        document.getElementById('memo').value = '';
        document.getElementById('aiAdviceBox').style.display = 'none';
        fetchLogs();
      }
      btn.disabled = false;
    });

    // APIキーの確保用関数
    function getApiKey() {
      let key = localStorage.getItem('gemini_api_key');
      if (!key) {
        key = prompt('Gemini APIキーを入力してください:');
        if (key) {
          localStorage.setItem('gemini_api_key', key.trim());
        }
      }
      return key;
    }

    // 単発AIアドバイス
    document.getElementById('aiBtn').addEventListener('click', async () => {
      const apiKey = getApiKey();
      if (!apiKey) return;

      const aiBtn = document.getElementById('aiBtn');
      const box = document.getElementById('aiAdviceBox');
      const content = document.getElementById('aiAdviceContent');

      aiBtn.disabled = true;
      aiBtn.textContent = '思考中...';
      box.style.display = 'block';
      content.textContent = '分析中...';

      const log = await saveLogData();
      if (!log) {
        aiBtn.disabled = false;
        aiBtn.textContent = '✨ 保存＆AIアドバイスをもらう';
        return;
      }

      const prompt = `あなたは思慮深い武道の師範です。以下の稽古内容とメモを読み、短く的確なワンポイントアドバイス（120〜150字程度）を送信してください。
種目: ${log.menu}, 回数: ${log.count}, メモ: ${log.memo || 'なし'}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          content.textContent = data.candidates[0].content.parts[0].text;
        } else {
          content.textContent = '生成に失敗しました。APIキーを確認してください。';
          localStorage.removeItem('gemini_api_key');
        }
      } catch (err) {
        content.textContent = '通信エラーが発生しました。';
      }

      aiBtn.disabled = false;
      aiBtn.textContent = '✨ 保存＆AIアドバイスをもらう';
    });

    // 過去分析（全体AI分析機能）
    document.getElementById('analyzeAllBtn').addEventListener('click', async () => {
      const apiKey = getApiKey();
      if (!apiKey) return;

      const btn = document.getElementById('analyzeAllBtn');
      const box = document.getElementById('analysisResultBox');
      const content = document.getElementById('analysisResultContent');

      btn.disabled = true;
      btn.textContent = '過去ログを分析中...';
      box.style.display = 'block';
      content.textContent = 'これまでの稽古データを読み込んで傾向を分析しています...';

      // ログが未取得なら取得
      if (cachedLogs.length === 0) {
        await fetchLogs();
      }

      if (cachedLogs.length === 0) {
        content.textContent = '分析するための稽古データがまだありません。まずは稽古を記録してみましょう！';
        btn.disabled = false;
        btn.textContent = '全稽古ログをAI分析する';
        return;
      }

      // 過去ログを整形してテキスト化
      const logsSummary = cachedLogs.slice(0, 30).map(l => 
        `・[${l.date}] ${l.menu} (${l.count}) / メモ: ${l.memo || 'なし'}`
      ).join('\n');

      const prompt = `あなたは武道稽古の師範・アドバイザーです。以下に蓄積された過去の稽古記録を読み込み、以下の点について総合的なアドバイスとフィードバック（300字程度）を提供してください。

1. 最近の稽古の継続傾向や集中的に行っている種目
2. メモから読み取れる技術的・精神的な成長や課題
3. 今後の稽古に向けた温かい励ましとアドバイス

【稽古ログデータ】
${logsSummary}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          content.textContent = data.candidates[0].content.parts[0].text;
        } else {
          content.textContent = '分析に失敗しました。APIキーを確認してください。';
          localStorage.removeItem('gemini_api_key');
        }
      } catch (err) {
        content.textContent = '通信エラーが発生しました。';
      }

      btn.disabled = false;
      btn.textContent = '全稽古ログをAI分析する';
    });

    // 五輪書テキスト表示
    function loadGorinChapter() {
      const val = document.getElementById('gorinSelect').value;
      if (gorinData[val]) {
        document.getElementById('gorinTitle').textContent = gorinData[val].title;
        document.getElementById('gorinText').textContent = gorinData[val].text;
      }
    }

    // エスケープ関数
    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      fetchLogs();
      loadGorinChapter();
    });
  </script>
</body>
</html>
