<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>武道稽古記録</title>
  <style>
    :root {
      --primary-color: #5c3a93;
      --primary-hover: #4a2e78;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #dddddd;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      background-color: var(--card-bg);
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
    }

    /* タブナビゲーション */
    .tab-nav {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      background-color: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 5px;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }

    /* コンテンツエリア */
    .tab-content {
      display: none;
      padding: 20px;
      flex: 1;
    }

    .tab-content.active {
      display: block;
    }

    /* フォーム・要素スタイル */
    h2 {
      font-size: 18px;
      margin-top: 0;
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 5px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
    }

    input[type="date"], input[type="text"], textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #5a6268;
    }

    .btn-secondary:hover {
      background-color: #464c52;
    }

    /* AIレスポンス表示 */
    .ai-box {
      margin-top: 15px;
      padding: 15px;
      background-color: #f0f3ff;
      border-left: 4px solid var(--primary-color);
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .error-box {
      margin-top: 15px;
      padding: 15px;
      background-color: #fff0f0;
      border-left: 4px solid #d9534f;
      color: #d9534f;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* 履歴リスト */
    .log-card {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      color: #555;
      margin-bottom: 5px;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 5px;
    }

    .log-body {
      font-size: 14px;
      margin-bottom: 8px;
      white-space: pre-wrap;
    }

    .log-ai {
      font-size: 12px;
      background-color: #f8f9fa;
      padding: 8px;
      border-radius: 4px;
      color: #444;
    }

    .delete-btn {
      color: #ff4d4d;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      float: right;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- タブナビゲーション -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('record')">📝 記録する</button>
    <button class="tab-btn" onclick="switchTab('history')">📋 稽古履歴</button>
    <button class="tab-btn" onclick="switchTab('analytics')">📊 過去分析</button>
  </div>

  <!-- 1. 記録タブ -->
  <div id="tab-record" class="tab-content active">
    <h2>稽古の記録</h2>
    <div class="form-group">
      <label for="log-date">日付</label>
      <input type="date" id="log-date">
    </div>
    <div class="form-group">
      <label for="log-type">稽古種別</label>
      <select id="log-type">
        <option value="道場稽古">道場稽古</option>
        <option value="自宅稽古">自宅稽古</option>
        <option value="自主トレ">自主トレ</option>
        <option value="その他">その他</option>
      </select>
    </div>
    <div class="form-group">
      <label for="log-content">稽古内容・気づき・指導事項</label>
      <textarea id="log-content" placeholder="例：基本一の形を中心に稽古。初太刀の横一のブレを指摘された。"></textarea>
    </div>

    <button class="btn" id="save-btn" onclick="saveRecord()">保存する</button>
    <button class="btn btn-secondary" onclick="saveRecordWithAI()">保存 ＆ AIアドバイスをもらう</button>

    <div id="record-ai-result"></div>
  </div>

  <!-- 2. 履歴タブ -->
  <div id="tab-history" class="tab-content">
    <h2>稽古履歴</h2>
    <div id="history-list"></div>
  </div>

  <!-- 3. 過去分析タブ -->
  <div id="tab-analytics" class="tab-content">
    <h2>過去分析とアドバイス</h2>
    <p style="font-size: 13px; color: #666;">これまでの稽古ログ全体をAIが振り返り、全体の傾向や今後の課題を分析します。</p>
    
    <button class="btn" onclick="analyzeAllLogs()">全稽古ログをAI分析する</button>
    <button class="btn btn-secondary" onclick="resetApiKey()">🔑 APIキーを再設定する</button>

    <div id="analytics-ai-result"></div>
  </div>
</div>

<script>
  // 初期化設定
  document.getElementById('log-date').valueAsDate = new Date();

  // タブ切り替え
  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    if (tabName === 'record') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-record').classList.add('active');
    } else if (tabName === 'history') {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-history').classList.add('active');
      renderHistory();
    } else if (tabName === 'analytics') {
      document.querySelectorAll('.tab-btn')[2].classList.add('active');
      document.getElementById('tab-analytics').classList.add('active');
    }
  }

  // LocalStorage管理
  function getLogs() {
    return JSON.parse(localStorage.getItem('budo_logs') || '[]');
  }

  function saveLogs(logs) {
    localStorage.setItem('budo_logs', JSON.stringify(logs));
  }

  function getApiKey() {
    let key = localStorage.getItem('gemini_api_key');
    if (!key) {
      key = prompt('Gemini APIキーを入力してください:');
      if (key) {
        localStorage.setItem('gemini_api_key', key.trim());
      }
    }
    return key;
  }

  function resetApiKey() {
    const key = prompt('新しいGemini APIキーを入力してください:');
    if (key) {
      localStorage.setItem('gemini_api_key', key.trim());
      alert('APIキーを更新しました。');
    }
  }

  // Gemini API 呼び出し（gemini-1.5-flash を使用）
  async function callGeminiAPI(promptText) {
    const apiKey = getApiKey();
    if (!apiKey) {
      throw new Error('APIキーが設定されていません。');
    }

    // gemini-1.5-flash を指定
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        contents: [{
          parts: [{ text: promptText }]
        }]
      })
    });

    const data = await response.json();

    if (!response.ok) {
      const errorMsg = data.error?.message || JSON.stringify(data);
      throw new Error(errorMsg);
    }

    return data.candidates[0].content.parts[0].text;
  }

  // 記録の保存（AIなし）
  function saveRecord() {
    const date = document.getElementById('log-date').value;
    const type = document.getElementById('log-type').value;
    const content = document.getElementById('log-content').value;

    if (!content.trim()) {
      alert('稽古内容を入力してください。');
      return;
    }

    const logs = getLogs();
    logs.unshift({
      id: Date.now(),
      date,
      type,
      content,
      aiAdvice: ''
    });

    saveLogs(logs);
    document.getElementById('log-content').value = '';
    alert('記録を保存しました！');
  }

  // 記録の保存（AIアドバイス付き）
  async function saveRecordWithAI() {
    const date = document.getElementById('log-date').value;
    const type = document.getElementById('log-type').value;
    const content = document.getElementById('log-content').value;
    const resultDiv = document.getElementById('record-ai-result');

    if (!content.trim()) {
      alert('稽古内容を入力してください。');
      return;
    }

    resultDiv.innerHTML = '<div class="ai-box">🤖 AIがアドバイスを生成中...</div>';

    const prompt = `あなたは武道（居合・剣道・空手等）の熟練指導者です。
以下の稽古内容に対して、具体的かつ実践的な短いフィードバックとアドバイス（200文字程度）を行ってください。

【稽古種別】${type}
【稽古内容】${content}`;

    try {
      const aiAdvice = await callGeminiAPI(prompt);
      
      const logs = getLogs();
      logs.unshift({
        id: Date.now(),
        date,
        type,
        content,
        aiAdvice
      });
      saveLogs(logs);

      resultDiv.innerHTML = `<div class="ai-box"><strong>📊 AIアドバイス:</strong>\n${aiAdvice}</div>`;
      document.getElementById('log-content').value = '';
    } catch (err) {
      resultDiv.innerHTML = `<div class="error-box">❌ エラーが発生しました:\n${err.message}</div>`;
    }
  }

  // 履歴の描画
  function renderHistory() {
    const logs = getLogs();
    const container = document.getElementById('history-list');

    if (logs.length === 0) {
      container.innerHTML = '<p style="color: #888;">まだ稽古記録がありません。</p>';
      return;
    }

    container.innerHTML = logs.map(log => `
      <div class="log-card">
        <div class="log-header">
          <span>${log.date} [${log.type}]</span>
          <button class="delete-btn" onclick="deleteLog(${log.id})">削除</button>
        </div>
        <div class="log-body">${escapeHtml(log.content)}</div>
        ${log.aiAdvice ? `<div class="log-ai">🤖 <strong>AI:</strong> ${escapeHtml(log.aiAdvice)}</div>` : ''}
      </div>
    `).join('');
  }

  function deleteLog(id) {
    if (confirm('この記録を削除してもよろしいですか？')) {
      let logs = getLogs();
      logs = logs.filter(l => l.id !== id);
      saveLogs(logs);
      renderHistory();
    }
  }

  // 全ログのAI分析
  async function analyzeAllLogs() {
    const logs = getLogs();
    const resultDiv = document.getElementById('analytics-ai-result');

    if (logs.length === 0) {
      alert('分析する稽古ログがありません。まず稽古を記録してください。');
      return;
    }

    resultDiv.innerHTML = '<div class="ai-box">🤖 全稽古ログを分析中...</div>';

    const logText = logs.map(l => `・${l.date} [${l.type}]: ${l.content}`).join('\n');

    const prompt = `あなたは武道の総師範です。
以下に記録された過去の稽古ログ全体を分析し、
1. 全体的な稽古の傾向や成果
2. 繰り返し出てくる課題や癖
3. 今後の稽古で意識すべきポイント
について、分かりやすくアドバイスしてください。

【稽古ログ一覧】
${logText}`;

    try {
      const analysis = await callGeminiAPI(prompt);
      resultDiv.innerHTML = `<div class="ai-box"><strong>📊 稽古傾向とアドバイス:</strong>\n${analysis}</div>`;
    } catch (err) {
      resultDiv.innerHTML = `<div class="error-box">❌ エラーが発生しました:\n${err.message}</div>`;
    }
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
