<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>稽古記録アプリ</title>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --background-color: #f5f6fa;
            --button-color: #e74c3c;
            --button-hover: #c0392b;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--background-color);
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--secondary-color);
        }
        input[type="date"],
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--button-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: var(--button-hover);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        #message {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            color: green;
        }
        .error-message {
            color: red;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>稽古記録</h1>

    <!-- 入力フォーム -->
    <form id="keiko-form">
        <div class="form-group">
            <label for="date">日付</label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label for="menu">稽古メニュー</label>
            <input type="text" id="menu" list="menu-options" placeholder="メニューを入力または選択" required>
            <datalist id="menu-options">
                <option value="基本：素振り（真向）"></option>
                <option value="基本：素振り（左右袈裟）"></option>
                <option value="基本：素振り（左右逆袈裟）"></option>
                <option value="基本：素振り（横一文字）"></option>
                <option value="基本：体さばき・運足"></option>
                <option value="形：基本一"></option>
                <option value="形：五用・真"></option>
                <option value="形：五用・左"></option>
                <option value="形：五箇・水月"></option>
                <option value="形：五箇・響き返し"></option>
                <option value="自由組太刀：基本サバキ（一番〜七番）"></option>
                <option value="補強：腕立て伏せ"></option>
                <option value="補強：スクワット"></option>
                <option value="補強：腹筋"></option>
            </datalist>
        </div>
        <div class="form-group">
            <label for="count">回数</label>
            <input type="number" id="count" min="1" placeholder="例: 20" required>
        </div>
        <div class="form-group">
            <label for="memo">メモ（任意）</label>
            <input type="text" id="memo" placeholder="気づきや反省点など">
        </div>
        <button type="submit">記録を保存</button>
        <div id="message"></div>
    </form>

    <!-- 記録表示テーブル -->
    <table id="logs-table">
        <thead>
            <tr>
                <th>日付</th>
                <th>メニュー</th>
                <th>回数</th>
                <th>メモ</th>
            </tr>
        </thead>
        <tbody id="logs-body">
            <!-- JavaScriptでデータが挿入されます -->
        </tbody>
    </table>
</div>

<script>
    // ==========================================
    // Supabaseの接続情報
    // ==========================================
    const SUPABASE_URL = 'https://fonbifeltukfxpqzjqoj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_bovqGmr1ilPdHixHOzbGxQ_B_9DmZOD';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 今日の日付をデフォルトでセット
    document.getElementById('date').valueAsDate = new Date();

    // フォーム送信時の処理（データ追加）
    document.getElementById('keiko-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const date = document.getElementById('date').value;
        const menu = document.getElementById('menu').value;
        const count = parseInt(document.getElementById('count').value, 10);
        const memo = document.getElementById('memo').value;
        const messageEl = document.getElementById('message');

        messageEl.textContent = '保存中...';
        messageEl.className = '';

        const { data, error } = await supabase
            .from('keiko_logs')
            .insert([{ date: date, menu: menu, count: count, memo: memo }]);

        if (error) {
            console.error('Error inserting data:', error);
            messageEl.textContent = 'エラーが発生しました: ' + error.message;
            messageEl.className = 'error-message';
        } else {
            messageEl.textContent = '記録を保存しました！';
            messageEl.style.color = 'green';
            document.getElementById('memo').value = ''; // メモだけクリア（連続入力を想定）
            
            // データを再取得して表示を更新
            fetchLogs();
            
            // 3秒後にメッセージを消す
            setTimeout(() => { messageEl.textContent = ''; }, 3000);
        }
    });

    // データを取得してテーブルに表示する関数
    async function fetchLogs() {
        const { data, error } = await supabase
            .from('keiko_logs')
            .select('*')
            .order('date', { ascending: false })
            .order('created_at', { ascending: false })
            .limit(50); // 最新50件を表示

        if (error) {
            console.error('Error fetching data:', error);
            return;
        }

        const tbody = document.getElementById('logs-body');
        tbody.innerHTML = ''; // テーブルをクリア

        data.forEach(log => {
            const tr = document.createElement('tr');
            
            // 日付のフォーマットをシンプルにする（YYYY-MM-DD）
            const dateStr = log.date ? log.date.split('T')[0] : '';
            
            tr.innerHTML = `
                <td>${dateStr}</td>
                <td>${log.menu || ''}</td>
                <td>${log.count || 0}</td>
                <td>${log.memo || ''}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // ページ読み込み時にデータを取得
    window.onload = fetchLogs;
</script>

</body>
</html>
