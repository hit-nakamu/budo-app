<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>武道稽古記録 & 五輪書</title>
  
  <!-- Supabase JavaScript SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #2980b9;
      --ai-color: #8e44ad;
      --gorin-color: #d35400;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #e0e0e0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: #333;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 1.2rem;
      color: var(--primary-color);
      margin-top: 24px;
      margin-bottom: 12px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--primary-color);
    }

    input[type="date"],
    input[type="text"],
    input[type="number"],
    textarea,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      height: 80px;
    }

    button {
      width: 100%;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #1f6391;
    }

    .btn-ai {
      background-color: var(--ai-color);
      margin-top: 10px;
    }

    .btn-ai:hover {
      background-color: #732d91;
    }

    /* AIアドバイス表示エリア */
    .ai-advice-box {
      background: #f3ebf7;
      border: 1px solid #dcd0e5;
      border-left: 4px solid var(--ai-color);
      border-radius: 6px;
      padding: 14px;
      margin-top: 14px;
      display: none;
    }

    .ai-advice-title {
      font-weight: bold;
      color: var(--ai-color);
      margin-bottom: 6px;
    }

    .ai-advice-content {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #333;
      white-space: pre-wrap;
    }

    /* 五輪書セクション */
    .gorin-select {
      margin-bottom: 12px;
    }

    .gorin-content-box {
      background: #fffdf9;
      border: 1px solid #f0e2d0;
      border-left: 4px solid var(--gorin-color);
      border-radius: 6px;
      padding: 16px;
      margin-top: 10px;
      max-height: 500px;
      overflow-y: auto;
    }

    .gorin-title {
      font-weight: bold;
      color: var(--gorin-color);
      font-size: 1.1rem;
      margin-bottom: 12px;
      border-bottom: 1px solid #f0e2d0;
      padding-bottom: 6px;
    }

    .gorin-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #333;
      white-space: pre-wrap;
    }

    /* 履歴アイテム */
    .log-item {
      background: var(--card-bg);
      border-left: 4px solid var(--accent-color);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 6px;
      color: var(--primary-color);
    }

    .log-menu {
      color: var(--accent-color);
    }

    .log-memo {
      font-size: 0.9rem;
      color: #555;
      white-space: pre-wrap;
      margin-top: 6px;
    }

    .empty-state {
      text-align: center;
      color: #888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🥋 武道稽古記録 & AIアドバイザー</h1>

    <!-- 記録入力フォーム -->
    <div class="card">
      <form id="keikoForm">
        <div class="form-group">
          <label for="date">稽古日</label>
          <input type="date" id="date" required>
        </div>

        <div class="form-group">
          <label for="menu">種目名</label>
          <input type="text" id="menu" placeholder="例: 形、禅、ストレッチ" required>
        </div>

        <div class="form-group">
          <label for="count">回数・時間</label>
          <input type="number" id="count" placeholder="例: 10 (本/分など)" required>
        </div>

        <div class="form-group">
          <label for="memo">メモ・気づき</label>
          <textarea id="memo" placeholder="例: 横一の振りを意識した、重心がぶれた"></textarea>
        </div>

        <button type="submit" id="submitBtn">記録を保存する</button>
        <button type="button" id="aiBtn" class="btn-ai">✨ 保存＆AIアドバイスをもらう</button>
      </form>

      <!-- AIアドバイス結果エリア -->
      <div id="aiAdviceBox" class="ai-advice-box">
        <div class="ai-advice-title">🤖 AI武道師範のアドバイス</div>
        <div id="aiAdviceContent" class="ai-advice-content"></div>
      </div>
    </div>

    <!-- 📖 五輪書 閲覧エリア -->
    <h2>📖 五輪書（宮本武蔵）現代語訳</h2>
    <div class="card">
      <div class="form-group gorin-select">
        <label for="gorinChapter">読む章を選択してください</label>
        <select id="gorinChapter">
          <option value="chi">地の巻（兵法の土台・基本思想）</option>
          <option value="mizu">水の巻（心構え・構え・身体の運用・剣術）</option>
          <option value="hi">火の巻（戦いの実戦・勝敗・駆け引き）</option>
          <option value="kaze">風の巻（他流派の研究・兵法の本質）</option>
          <option value="ku">空の巻（極意・自然の理・あるがまま）</option>
        </select>
      </div>

      <div class="gorin-content-box">
        <div id="gorinTitle" class="gorin-title">地の巻</div>
        <div id="gorinText" class="gorin-text"></div>
      </div>
    </div>

    <!-- 履歴表示エリア -->
    <h2>稽古履歴</h2>
    <div id="logList">
      <div class="empty-state">データを読み込み中...</div>
    </div>
  </div>

  <script>
    // --- 設定情報 ---
    const SUPABASE_URL = 'https://fonbifeltukfxpqzjqoj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_bovqGmr1ilPdHixHOzbGxQ_B_9DmZOD';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 五輪書（現代語訳全文データ）
    const gorinData = {
      chi: {
        title: "地の巻（ちのまき）- 兵法の土台と理念",
        text: `【はじめに】
兵法とは、武士が身につけるべき道の基本である。武士たる者は、勝負の理を究め、勝ちを制することを目指さねばならない。

【兵法の道を建てるということ】
兵法を学ぶ者は、まずその「土台（地）」を固めなければならない。ちょうど大工の棟梁が建物の全体の構造を理解し、材木の特性を見極めて適材適所に配するように、兵法家も道具の特性を知り、己の身体と技を巧みに用いることが求められる。

【武士の道の四つの道】
世の中には「農・工・商・士」の四つの道がある。
・農の道：四季の移り変わりに応じて作物を育て、生きる糧を得る。
・商の道：商品を売り買いし、利益を得て生活を立てる。
・工の道：さまざまな道具や建造物を工夫して作り出す。
・士の道：兵法の実力を養い、いざという時に勝ちを制し、主君や己の立ち位置を全うする。

【兵法における道具と二刀の理】
武士は常に二つの刀を帯びる。これには深い理がある。いかなる武器もその特性を知り、状況に応じて最大限に活かさねばならない。二刀を用いる稽古を重ねることで、片手に偏らない自在な身体運用が可能となる。

【鍛錬の心構え】
千日の稽古を「鍛（たん）」とし、万日の稽古を「錬（れん）」とする。日々の休みなき継続と追求の先においてのみ、真の技と心が錬り上げられるのである。

【地に刻むべき九つの道】
一、よこしま（邪）な心を起こさないこと。
二、道の修練を休まないこと。
三、諸芸・諸術に触れて視野を広げること。
四、様々な職業・道の理を知ること。
五、物事の損得や利害を見極めること。
六、あらゆる事象の真偽・直感を見抜く目（観の目）を養うこと。
七、目に見えない微細な変化を察知すること。
八、わずかな油断や怠惰にも気を配ること。
九、役に立たない無駄なことをしないこと。`
      },
      mizu: {
        title: "水の巻（みずのまき）- 心構え・構え・身体の運用・剣術",
        text: `【心構え：水の心】
水は四角い器にも丸い器にも柔軟にその形を変え、一滴の水滴ともなれば、広大な大海ともなる。兵法の心もまた、水のように柔軟で透明であり、何物にもとらわれない平常心を保たねばならない。

【精神と体の持ち方】
心は常に平常を保ち、偏らず、硬くならず、伸び伸びと直くあること。精神を静かに据えつつも、身体の動きは自由自在でなければならない。

【目付け：観の目と見の目】
兵法における目付けは、「観（かん）の目を強く、見（けん）の目を弱く」することが極意である。
・見の目：表面的な動きや相手の剣先だけを追う目。
・観の目：相手の心根、全体の拍子、戦況の本質を見抜く深い目。
遠い山を見るように全体を大きく捉えよ。

【五つの構え】
構えには「上段・中段・下段・右脇・左脇」の五つがある。しかし、本質においては「構えて構えなし」である。構えは相手との間合いや状況に応じて自然に変化するものであり、特定の型に固執してはならない。

【太刀の振り方と身体運用】
太刀は無駄な力で握るものではなく、自然な理に従って振るものである。腕の力で振り回すのではなく、体幹と足さばきの一致によって刀を運ぶ。相手を斬るのではなく、「理をもって刃を通す」感覚を忘れてはならない。`
      },
      hi: {
        title: "火の巻（ひのまき）- 戦いの実戦・勝敗・駆け引き",
        text: `【戦いにおける火の勢い】
火は小さく燃え上がり、瞬時に大きく広がる。状況は一刻一刻変化する。火の巻では、実際の戦いにおける勝負の駆け引き、勢いと拍子の支配について説く。

【三つの先（せん）】
一、意の先（けんのせん）：相手が攻撃しようと動く前に、こちらから先手を打って制する。
二、対の先（たいのせん）：相手が攻めてきた瞬間、その攻撃に応じつつ先を取って打つ。
三、構の先（たいたいのせん）：互いに構え合った状態から、相手の動揺や拍子の乱れを誘い、先を制する。

【陰を動かす・崩し】
相手が攻めあぐねている時や、静観している時は、こちらの強い攻めや変化を見せることで相手の心を動かし、隙を作らせる。相手の心が崩れた瞬間を逃さず叩くことが大切である。

【拍子を外す・影を打つ】
相手と同じ拍子（リズム）で動いていては相打ちになる。相手のリズムを外し、意表を突く間合いとタイミングで技を繰り出すこと。

【鼠頭午首（そとうごしゅ）】
細かい技術に捉われそうな時は頭を大きく（牛のように）切り替え、全体に捉われすぎた時は細部（鼠のように）に気を配る。ミクロとマクロの視点を自由に行き来せよ。`
      },
      kaze: {
        title: "風の巻（かぜのまき）- 他流派の研究・兵法の本質",
        text: `【風の意味と他流を知る意義】
「風」とは世風であり、他流派の風気を意味する。自らの兵法を真に極めるためには、他流派の特徴、長所、短所を正しく知らねばならない。

【長い太刀を好む流派への批評】
長すぎる太刀に頼る者は、離れた場所から手軽に勝とうとする邪心を生みやすい。間合いの本質を理解せず、ただ道具の長さに依存することは、真の武術の理に反する。

【速さを求める流派への批評】
ただ動作の速さのみを競う流派は、無駄な焦りを生み、拍子を乱す。真の速さとは、無駄な動きが削ぎ落とされた結果生まれる「自然なスムーズさ」であり、バタバタと急ぐことではない。

【強烈な打ちを好む流派への批評】
力任せに激しく叩きつける打ち込みは、刀を傷め、自身の体勢を崩す原因となる。勝負を決する斬り込みとは、力づくではなく、理に適った的確なひと筋である。

【他流の固執を去り、理に帰す】
特定の型や道具、異端なテクニックに執着する流派は、本質を見失う。兵法の道とは、極めてシンプルで、理にかなった自然体の追求に他ならない。`
      },
      ku: {
        title: "空の巻（くうのまき）- 極意・自然の理・あるがまま",
        text: `【空（くう）の境地】
二つの事柄の間に横たわる、何も無い状態を「空」というのではない。自意識や執着、迷いや偏りがすべて消え去った、澄み渡った境地を指すのである。

【知から空へ】
初めは道具の使い方を学び、技を学び、理屈を習得する。しかし、その修練の果てに、技や理屈を意識することなく、身体が自然に動く領域に達する。これこそが「空」である。

【真の道】
「心を空にして、直き（すなおき）心を道とす」
実直に稽古を重ね、自らの心を磨き続けた先に、一切の迷いが消えた「真の空」があらわれる。

あらゆる技、あらゆる構え、あらゆる戦略を超越したあるがままの自然体。これこそが兵法・二天一流の究極の到達点である。`
      }
    };

    // 五輪書の切り替え処理
    const gorinSelect = document.getElementById('gorinChapter');
    const gorinTitle = document.getElementById('gorinTitle');
    const gorinText = document.getElementById('gorinText');

    function updateGorin() {
      const selected = gorinSelect.value;
      if (gorinData[selected]) {
        gorinTitle.textContent = gorinData[selected].title;
        gorinText.textContent = gorinData[selected].text;
      }
    }

    gorinSelect.addEventListener('change', updateGorin);
    updateGorin(); // 初期表示

    // 今日の日付を初期値としてセット
    document.getElementById('date').valueAsDate = new Date();

    // 稽古記録を取得して画面に表示する関数
    async function fetchLogs() {
      const logList = document.getElementById('logList');
      
      const { data: logs, error } = await supabaseClient
        .from('keiko_logs')
        .select('*')
        .order('date', { ascending: false })
        .order('id', { ascending: false });

      if (error) {
        console.error('取得エラー:', error);
        logList.innerHTML = '<div class="empty-state">データの取得に失敗しました</div>';
        return;
      }

      if (!logs || logs.length === 0) {
        logList.innerHTML = '<div class="empty-state">まだ記録がありません</div>';
        return;
      }

      logList.innerHTML = '';
      logs.forEach(log => {
        const item = document.createElement('div');
        item.className = 'log-item';
        item.innerHTML = `
          <div class="log-header">
            <span>${log.date || '日付なし'}</span>
            <span class="log-menu">${log.menu || ''} (${log.count || 0})</span>
          </div>
          ${log.memo ? `<div class="log-memo">${escapeHtml(log.memo)}</div>` : ''}
        `;
        logList.appendChild(item);
      });
    }

    // 共通のデータ保存処理
    async function saveLogData() {
      const date = document.getElementById('date').value;
      const menu = document.getElementById('menu').value;
      const count = parseInt(document.getElementById('count').value, 10);
      const memo = document.getElementById('memo').value;

      if (!menu || isNaN(count)) {
        alert('種目名と回数・時間を入力してください。');
        return null;
      }

      const { error } = await supabaseClient
        .from('keiko_logs')
        .insert([{ date, menu, count, memo }]);

      if (error) {
        console.error('保存エラー:', error);
        alert('保存に失敗しました: ' + error.message);
        return null;
      }

      await fetchLogs();
      return { date, menu, count, memo };
    }

    // 通常の保存ボタン
    document.getElementById('keikoForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      const result = await saveLogData();
      if (result) {
        document.getElementById('menu').value = '';
        document.getElementById('count').value = '';
        document.getElementById('memo').value = '';
        document.getElementById('aiAdviceBox').style.display = 'none';
      }

      submitBtn.disabled = false;
    });

    // ✨ AIアドバイスボタンの処理
    document.getElementById('aiBtn').addEventListener('click', async () => {
      const aiBtn = document.getElementById('aiBtn');
      const adviceBox = document.getElementById('aiAdviceBox');
      const adviceContent = document.getElementById('aiAdviceContent');

      // APIキーをローカルストレージ（ブラウザ内）に保持、なければ入力してもらう
      let apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        apiKey = prompt('Gemini APIキーを入力してください:');
        if (apiKey) {
          localStorage.setItem('gemini_api_key', apiKey.trim());
        } else {
          alert('APIキーが入力されなかったため、AIアドバイスはキャンセルされました。');
          return;
        }
      }

      aiBtn.disabled = true;
      aiBtn.textContent = '思考中...';
      adviceBox.style.display = 'block';
      adviceContent.textContent = '稽古内容を分析してアドバイスを生成しています...';

      // 1. データを保存
      const logData = await saveLogData();
      if (!logData) {
        aiBtn.disabled = false;
        aiBtn.textContent = '✨ 保存＆AIアドバイスをもらう';
        return;
      }

      // 2. Gemini API へ送信プロンプトを作成
      const promptText = `あなたは思慮深く温かい武道の師範・相談役です。
以下の稽古内容と気づき（メモ）を読み、五輪書の教え（観の目、鍛錬、平常心など）も踏まえつつ、励ましと具体的なワンポイントアドバイス（短く簡潔に120〜150文字程度）を提供してください。

【本日の稽古】
- 種目: ${logData.menu}
- 回数/時間: ${logData.count}
- 気づき・メモ: ${logData.memo || '特になし'}
`;

      try {
        // 3. Gemini API 呼び出し
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }]
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const reply = data.candidates[0].content.parts[0].text;
          adviceContent.textContent = reply;
        } else {
          adviceContent.textContent = 'アドバイスの生成に失敗しました。APIキーを確認してください。';
          localStorage.removeItem('gemini_api_key');
        }
      } catch (err) {
        console.error('API Error:', err);
        adviceContent.textContent = '通信エラーが発生しました。';
      }

      aiBtn.disabled = false;
      aiBtn.textContent = '✨ 保存＆AIアドバイスをもらう';
    });

    // エスケープ処理
    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // ページ読み込み時にログを取得
    window.addEventListener('DOMContentLoaded', fetchLogs);
  </script>
</body>
