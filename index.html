<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>武道稽古記録</title>
  
  <!-- Supabase JavaScript SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #2980b9;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #e0e0e0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: #333;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--primary-color);
    }

    input[type="date"],
    input[type="text"],
    input[type="number"],
    textarea,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      height: 80px;
    }

    button {
      width: 100%;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #1f6391;
    }

    .log-item {
      background: var(--card-bg);
      border-left: 4px solid var(--accent-color);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 6px;
      color: var(--primary-color);
    }

    .log-menu {
      color: var(--accent-color);
    }

    .log-memo {
      font-size: 0.9rem;
      color: #555;
      white-space: pre-wrap;
      margin-top: 6px;
    }

    .empty-state {
      text-align: center;
      color: #888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🥋 武道稽古記録</h1>

    <!-- 記録入力フォーム -->
    <div class="card">
      <form id="keikoForm">
        <div class="form-group">
          <label for="date">稽古日</label>
          <input type="date" id="date" required>
        </div>

        <div class="form-group">
          <label for="menu">種目名</label>
          <input type="text" id="menu" placeholder="例: 形、禅、ストレッチ" required>
        </div>

        <div class="form-group">
          <label for="count">回数・時間</label>
          <input type="number" id="count" placeholder="例: 10 (本/分など)" required>
        </div>

        <div class="form-group">
          <label for="memo">メモ・気づき</label>
          <textarea id="memo" placeholder="例: 横一の振りを意識した"></textarea>
        </div>

        <button type="submit" id="submitBtn">記録を保存する</button>
      </form>
    </div>

    <!-- 履歴表示エリア -->
    <h2>稽古履歴</h2>
    <div id="logList">
      <div class="empty-state">データを読み込み中...</div>
    </div>
  </div>

  <script>
    // Supabase 設定
    const SUPABASE_URL = 'https://fonbifeltukfxpqzjqoj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_bovqGmr1ilPdHixHOzbGxQ_B_9DmZOD';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 今日の日付を初期値としてセット
    document.getElementById('date').valueAsDate = new Date();

    // 稽古記録を取得して画面に表示する関数
    async function fetchLogs() {
      const logList = document.getElementById('logList');
      
      const { data: logs, error } = await supabaseClient
        .from('keiko_logs')
        .select('*')
        .order('date', { ascending: false })
        .order('id', { ascending: false });

      if (error) {
        console.error('取得エラー:', error);
        logList.innerHTML = '<div class="empty-state">データの取得に失敗しました</div>';
        return;
      }

      if (!logs || logs.length === 0) {
        logList.innerHTML = '<div class="empty-state">まだ記録がありません</div>';
        return;
      }

      logList.innerHTML = '';
      logs.forEach(log => {
        const item = document.createElement('div');
        item.className = 'log-item';
        item.innerHTML = `
          <div class="log-header">
            <span>${log.date || '日付なし'}</span>
            <span class="log-menu">${log.menu || ''} (${log.count || 0})</span>
          </div>
          ${log.memo ? `<div class="log-memo">${escapeHtml(log.memo)}</div>` : ''}
        `;
        logList.appendChild(item);
      });
    }

    // フォーム送信時の処理（追加保存）
    document.getElementById('keikoForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '保存中...';

      const date = document.getElementById('date').value;
      const menu = document.getElementById('menu').value;
      const count = parseInt(document.getElementById('count').value, 10);
      const memo = document.getElementById('memo').value;

      const { error } = await supabaseClient
        .from('keiko_logs')
        .insert([{ date, menu, count, memo }]);

      if (error) {
        console.error('保存エラー:', error);
        alert('保存に失敗しました: ' + error.message);
      } else {
        // フォームのリセット（日付は維持）
        document.getElementById('menu').value = '';
        document.getElementById('count').value = '';
        document.getElementById('memo').value = '';
        
        // 最新一覧の再取得
        await fetchLogs();
      }

      submitBtn.disabled = false;
      submitBtn.textContent = '記録を保存する';
    });

    // エスケープ処理（安全対策）
    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // ページ読み込み時にログを取得
    window.addEventListener('DOMContentLoaded', fetchLogs);
  </script>
</body>
</html>
